name: Probe Cineplex Germany

# Diagnostic only — does NOT scrape or submit anything. Round 1 (plain
# httpx, no TLS impersonation) 403'd both direct and via Decodo's proxy
# from a GitHub Actions runner — inconclusive, since that doesn't test
# what production's own cineplex.py actually does (curl_cffi's real
# browser TLS fingerprint spoofing via scrapling's Fetcher). Round 2
# re-tests with that same impersonated fetcher, direct and via Decodo's
# generic residential gateway (already used by UCI Kinowelt for a
# confirmed IP-reputation block), to isolate whether the remaining
# problem is IP reputation or something a proxy alone won't fix.

"on":
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe cineplex.de reachability, direct and via proxy
        env:
          DECODO_USERNAME: ${{ secrets.DECODO_USERNAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
        run: python -m scripts.probe_cineplex
