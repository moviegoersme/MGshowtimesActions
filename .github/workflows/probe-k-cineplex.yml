name: Probe K-Cineplex (Cyprus)

# Diagnostic only — does NOT scrape or submit anything. See
# scripts/probe_k_cineplex.py's own header comment for why: K-Cineplex's
# whole domain sits behind a real Cloudflare bot-verification challenge.
# The plain-Playwright `probe` job already answered one question with a
# real run's own logs: no, real Chromium automation doesn't get past it
# on its own (4 attempts, still "Just a moment..." every time — not a
# script bug, that run's navigation worked fine). The `probe-stealth` job
# tries a materially different approach — patchright's stealth-patched
# Chromium via scrapling's StealthyFetcher, which strips the automation
# fingerprints Cloudflare's detection keys on and has a `solve_cloudflare`
# option built for exactly this — before concluding no in-process
# automation can reach this data. A real extraction scraper only gets
# written once one of these actually gets through, from real evidence.

"on":
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Probe the Cloudflare challenge
        run: python -m scripts.probe_k_cineplex

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k-cineplex-probe-result
          path: |
            probe-result.png
            probe-result.html
          if-no-files-found: warn

  probe-stealth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps

      - name: Probe with stealth (patchright, real Chrome)
        run: python -m scripts.probe_k_cineplex_stealth

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k-cineplex-probe-stealth-result
          path: probe-stealth-result.html
          if-no-files-found: warn
