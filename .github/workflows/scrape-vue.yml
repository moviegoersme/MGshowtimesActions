name: Scrape Vue Cinemas (UK)

# Vue's 89 real UK locations (see scripts/scrape_vue.py's own docstring)
# sit behind a real Cloudflare "managed" challenge on every page AND its
# own JSON API — no in-process parser, on Vercel or otherwise, can get
# past it (confirmed live: scrapers/fetch.py gets a flat 403 on the films
# API itself). patchright with real_chrome=True does get through
# (confirmed live via scripts/probe_vue_stealth.py), so this is that
# chain's entire scrape path, independent of the app's own
# /api/cron/scrape sweep — same shape as scrape-k-cineplex.yml.
#
# Unlike K-Cineplex's 4 cinemas, this solves the Cloudflare challenge
# ONCE per run and reuses that single browser session for all 89
# cinemas' API calls (confirmed live via scripts/probe_vue_cinema_ids.py,
# which made 89 such calls in one session) — re-solving per cinema would
# be far slower and far more likely to trip rate-limiting.
#
# Ran on a 3-hour schedule (matching these 89 cinemas' own
# scrape_interval_minutes: 180 in cinemas/registry.yaml) from 2026-09-16
# through 2026-09-22 18:11 without issue — a full manual run wrote real,
# varying showtimes for all 89/89 cinemas (23 to 675 rows each, no
# failures) in about 12 minutes, comfortably inside this job's 45-minute
# timeout.
#
# Starting 2026-09-22 21:08, most runs started failing the Cloudflare
# challenge outright. Initially misdiagnosed as GitHub Actions' own IP
# ranges getting IP-reputation-blocked (same shape scrape-odeon.yml's
# own comment documented a week earlier for odeon.co.uk) — routing
# through the same Decodo residential proxy that fixed Odeon's problem
# did NOT fix this one (confirmed live, 2026-09-23: still 2/2 session
# attempts failed the challenge, even proxied). The real cause: a
# confirmed, still-open scrapling bug
# (github.com/D4Vinci/Scrapling/issues/422) — headless=True loops and
# fails to solve Cloudflare's "managed" challenge; headless=False (a
# real, non-headless browser window) solves the same challenge in
# seconds. scripts/scrape_vue.py now runs headless=False, which is why
# this job installs Xvfb and runs under it below — a real display is
# needed even though nothing here is ever actually looked at.
#
# IMPORTANT — the `schedule:` trigger is deliberately removed below,
# same reasoning as scrape-odeon.yml: the Decodo account's bandwidth
# budget is shared with Odeon (and now Cineworld too), and this script's
# own ~210+ small API calls per run add meaningfully more request volume
# on top of what that account was already budgeted for. Confirm real
# headroom via a manual workflow_dispatch run (and its actual Decodo
# usage) before restoring `schedule: - cron: "0 */3 * * *"`.

"on":
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Scrape and submit
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DECODO_USERNAME: ${{ secrets.DECODO_USERNAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
          # Python fully block-buffers stdout when it isn't a TTY (i.e.
          # always, under GH Actions) — without this, dozens of this
          # script's own per-cinema print()s land in the log as one big
          # burst whenever the buffer happens to flush, not as they
          # actually happen, making a genuinely slow-but-working run
          # indistinguishable from a hung one in the live log.
          PYTHONUNBUFFERED: "1"
        # xvfb-run gives the browser a real (virtual) display to run
        # non-headless against — see this file's own top comment for why
        # headless=False is required here.
        run: xvfb-run -a python -m scripts.scrape_vue
