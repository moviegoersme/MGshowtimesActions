name: Scrape Curzon (UK)

# Curzon's 14 real UK locations (see scripts/scrape_curzon.py's own
# docstring) sit behind a real Cloudflare challenge on curzon.com itself
# (confirmed live: a plain unauthenticated GET 403s on every path, even
# /robots.txt). Its digital-api.curzon.com booking API USED to have no
# gate at all, but since 2026-09-23 it 403s every plain out-of-browser
# request too -- so every API call is now made from inside the browser
# page itself (page.evaluate(fetch(...)), same as Vue's own scrape), in
# batches of a few cinemas per fresh browser session. See
# scripts/scrape_curzon.py's own docstring for the details.
#
# Scheduled every 3 hours, matching these 14 cinemas' own
# scrape_interval_minutes: 180 in cinemas/registry.yaml -- offset from
# this repo's other GitHub-Actions-only scrapes (scrape-vue.yml's "0",
# scrape-cineworld.yml's "30 1-23/3", scrape-omniplex.yml's "15") so they
# don't all fire at once. workflow_dispatch stays available too, for a
# manual re-run any time.
#
# UPDATE 2026-09-26: silently broken from 2026-09-25 ~18:55 UTC through
# today -- a confirmed, still-open scrapling bug
# (github.com/D4Vinci/Scrapling/issues/422), same root cause already
# found and fixed for Vue/Odeon/K-Cineplex/Cineworld: headless=True loops
# and fails to solve Cloudflare's "managed" challenge.
# scripts/scrape_curzon.py now runs headless=False, which is why this job
# installs Xvfb and runs under it below.

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "45 */3 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Scrape and submit
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Stream this script's per-cinema print()s live instead of in
          # one burst whenever Python's block buffer happens to flush.
          PYTHONUNBUFFERED: "1"
        # xvfb-run gives the browser a real (virtual) display to run
        # non-headless against -- see this file's own top comment for why
        # headless=False is required here.
        run: xvfb-run -a python -m scripts.scrape_curzon
