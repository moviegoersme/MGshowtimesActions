name: Probe Cineworld (Ireland)

# Diagnostic only — does NOT scrape or submit anything. cineworld.ie is a
# separate domain from cineworld.co.uk (already covered for UK/NI by
# scrape-cineworld.yml). Confirmed live from this session's own IP
# (2026-09-30): cineworld.ie returns a hard Cloudflare WAF block
# ("Sorry, you have been blocked"), not the solvable "managed" Turnstile
# challenge cineworld.co.uk gives — so this runs from GitHub Actions'
# own runner IP, routed through a Decodo residential proxy pinned to an
# Irish exit (same class of fix scrape_cineworld.py's own UK build used:
# a country-guaranteed exit rather than the generic rotating pool, after
# Cloudflare's Bot Management rejected non-matching-country IPs even
# once the homepage itself passed).
#
# scripts/probe_cineworld_ireland.py records every network response
# fired while loading cineworld.ie's own cinemas-listing page, to find
# the real Republic-of-Ireland cinema list and whether it shares
# cineworld.co.uk's Gatsby/boxofficeapi platform or runs its own.

"on":
  workflow_dispatch: {}

jobs:
  probe-cinemas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Probe cinemas-listing page traffic
        env:
          DECODO_USERNAME: ${{ secrets.DECODO_USERNAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
        run: xvfb-run -a python -m scripts.probe_cineworld_ireland

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cineworld-ireland-probe-result
          path: |
            probe-cineworld-ireland-results.json
            probe-cineworld-ireland-home.html
          if-no-files-found: warn
