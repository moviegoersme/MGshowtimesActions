name: Probe Cineworld (UK)

# Diagnostic only — does NOT scrape or submit anything. Earlier rounds of
# this workflow (see git history for scripts/probe_cineworld*.py) already
# answered:
# - From this repo's own network, cineworld.co.uk hard-blocks outright;
#   from GitHub's own runner IP it's a solvable "managed" Turnstile
#   challenge instead, and real_chrome=True clears it.
# - Cineworld's site was rebuilt ENTIRELY overnight (confirmed live,
#   2026-09-17 — the production scraper that worked cleanly the day
#   before started 404ing on every call). New Gatsby-based site (CMS
#   "webediamovies.pro"), new API
#   (/api/gatsby-source-boxofficeapi/schedule and .../scheduledMovies),
#   and new alphanumeric theater ids (e.g. "X079J") replacing the old
#   numeric ones (e.g. "044") entirely. The old
#   /uk/data-api-service/v1/quickbook/... API is gone.
# - The full old-slug -> new-theaterId map was recovered from a Gatsby
#   page-data.json's own embedded 87-cinema sitemap — 85 slugs matched
#   this repo's existing registry exactly, 2 renamed on Cineworld's own
#   side (newport-spytty-park -> newport-wales-spytty-park, chichester ->
#   chichester-gate).
# Those jobs were removed once answered, to keep re-runs of this
# workflow fast — see git history if they need to be re-run. The
# probe-newapi job (scripts/probe_cineworld_newapi.py) answered:
# - The schedule endpoint's `to` param DOES accept a wide range: 7 days
#   in one call, single theater, confirmed live (361 real sessions for
#   theater X079J, dates 2026-09-17 through 2026-09-23).
# - `theaters` does NOT accept more than one theater — a 2-theater call
#   returned HTTP 500. One call per theater is required.
# - scheduledMovies?theaterId=X079J returns ONLY numeric movie ids
#   (movieIds.titleAsc/releaseAsc) — no titles anywhere, confirmed by
#   inspecting its full body. Same is true of the schedule endpoint's
#   own session records. The new API has no title anywhere we've found.
#
# The open question this version answers: scripts/probe_cineworld_titles.py
# records every real network response fired while loading Cineworld's
# own /films/ listing page, to find whichever endpoint (or Gatsby
# page-data.json) actually carries real movie titles for real movie
# ids — not guessed, since neither of the new API's own endpoints
# carries one.

"on":
  workflow_dispatch: {}

jobs:
  probe-titles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps

      - name: Find the real movie-title source on the /films/ listing page
        run: python -m scripts.probe_cineworld_titles

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cineworld-probe-titles-result
          path: probe-cineworld-titles-results.json
          if-no-files-found: warn
