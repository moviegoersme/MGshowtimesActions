name: Scrape Odeon (Ireland)

# Odeon Ireland's 11 real locations (see scripts/scrape_odeon_ireland.py's
# own docstring for the full 6-round discovery trail). odeoncinemas.ie
# runs a newer "Omnia" CMS but real showtimes come from the same Vista
# OCAPI tenant UK uses, reached directly at vwc.odeoncinemas.ie -- no
# Cloudflare solve or proxy needed for the data calls themselves, only
# for the one lightweight page load that grabs a fresh auth JWT (embedded
# directly in that page's own server-rendered HTML).

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Scrape and submit
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DECODO_USERNAME: ${{ secrets.DECODO_USERNAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a python -m scripts.scrape_odeon_ireland
