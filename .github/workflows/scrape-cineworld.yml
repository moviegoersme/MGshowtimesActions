name: Scrape Cineworld (UK)

# Cineworld's 87 real UK locations (see scripts/scrape_cineworld.py's own
# docstring) sit behind a real Cloudflare "managed" challenge on every
# page AND its own JSON API — no in-process parser, on Vercel or
# otherwise, can get past it (confirmed live: scrapers/fetch.py gets a
# flat 403 on the data API itself). patchright with real_chrome=True does
# get through (confirmed live via scripts/probe_cineworld_stealth.py), so
# this is that chain's entire scrape path, independent of the app's own
# /api/cron/scrape sweep — same shape as scrape-vue.yml.
#
# Cinemas are processed in batches of 12, re-solving Cloudflare fresh at
# the start of each batch (scripts/scrape_cineworld.py's own BATCH_SIZE)
# — a first full run reusing ONE session for all 87 cinemas found its
# Cloudflare clearance doesn't reliably survive that much API traffic
# (real data for ~15-21 cinemas, then 403 "Just a moment..." on every
# remaining call, confirmed live via diagnostic logging). Batching fixed
# it: confirmed live, 2026-09-16, all 87/87 cinemas' latest run
# status=success, 35,559 real showtimes written (against the OLD
# quickbook API — see scrape_cineworld.py's own docstring for the
# 2026-09-17 site rebuild that replaced it; the batching design carried
# straight over to the new API unchanged).
#
# Ran on a schedule (offset 90 minutes from scrape-vue.yml's own cron)
# without issue from 2026-09-16 through 2026-09-22 ~19:35 — previously
# every 3 hours ("30 1-23/3 * * *"), which was itself a stale mismatch
# against these 87 cinemas' own scrape_interval_minutes: 240 in
# cinemas/registry.yaml; corrected to match below.
#
# Starting around 2026-09-22 21:00-22:30, runs started failing outright.
# Routing through the same Decodo residential proxy that fixed Odeon's
# IP-reputation block did NOT fix this (confirmed live, 2026-09-23): the
# homepage itself loaded fine (no Cloudflare challenge shown at all), but
# every per-cinema schedule API call got a flat 403 — confirmed via a
# direct curl (Server: cloudflare, a fresh __cf_bm cookie) to be
# Cloudflare's own Bot Management silently rejecting the request, not a
# solvable challenge and not a Cineworld-side WAF.
#
# Two separate fixes were needed:
# 1. A confirmed, still-open scrapling bug
#    (github.com/D4Vinci/Scrapling/issues/422) — headless=True loops and
#    fails to solve Cloudflare's "managed" challenge (the earlier "403
#    'Just a moment...'" symptom this file's own history already
#    documented above is exactly that shape); headless=False (a real,
#    non-headless browser window) solves it in seconds.
#    scripts/scrape_cineworld.py now runs headless=False, which is why
#    this job installs Xvfb and runs under it below.
# 2. The Bot Management 403 on the API path itself: fixed by switching
#    the Decodo proxy from the generic gate.decodo.com:7000 every other
#    script here uses to Decodo's dedicated UK endpoint
#    (gb.decodo.com:30000) — a guaranteed-UK exit IP scores differently
#    for this UK-only chain's own API than whatever country the generic
#    rotating pool happened to hand out (scripts/scrape_cineworld.py's
#    own comment on this).
#
# Confirmed live, 2026-09-23: a fresh manual run solved Cloudflare
# cleanly across all 8 batches and wrote real showtimes for all 87/87
# cinemas — schedule restored below, corrected to the registry's own
# 240-minute (4-hour) interval.

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "30 1-23/4 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Scrape and submit
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DECODO_USERNAME: ${{ secrets.DECODO_USERNAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
          # See scrape-vue.yml's own comment on this — same block-buffered
          # stdout problem applies here.
          PYTHONUNBUFFERED: "1"
        # xvfb-run gives the browser a real (virtual) display to run
        # non-headless against — see this file's own top comment for why
        # headless=False is required here.
        run: xvfb-run -a python -m scripts.scrape_cineworld
