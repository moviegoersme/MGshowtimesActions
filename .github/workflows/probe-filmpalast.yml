name: Probe Filmpalast Cloudflare Challenge

# Diagnostic only -- does NOT scrape or submit anything. Round 3: drives
# the real Playwright page to see what request(s) the programme page's
# own React widget makes after hydrating -- see
# scripts/probe_filmpalast.py's own docstring in the private repo.

"on":
  workflow_dispatch: {}

jobs:
  probe-filmpalast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Probe Filmpalast programme page's own requests
        run: xvfb-run -a python -m scripts.probe_filmpalast

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filmpalast-probe-round3-result
          path: |
            probe-filmpalast-rendered.html
            probe-filmpalast-requests.txt
          if-no-files-found: warn
