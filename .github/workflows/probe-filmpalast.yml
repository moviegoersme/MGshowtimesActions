name: Probe Filmpalast Cloudflare Challenge

# Diagnostic only -- does NOT scrape or submit anything. Round 2: fetches
# the real programme page and the site's own wp-json/pmkino/v1 REST API
# root found in round 1's cleared homepage -- see
# scripts/probe_filmpalast.py's own docstring in the private repo.

"on":
  workflow_dispatch: {}

jobs:
  probe-filmpalast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Probe Filmpalast programme page and API root
        run: xvfb-run -a python -m scripts.probe_filmpalast

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filmpalast-probe-round2-result
          path: |
            probe-filmpalast-programm.html
            probe-filmpalast-api-root.json
          if-no-files-found: warn
