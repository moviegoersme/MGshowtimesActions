name: Scrape K-Cineplex (Cyprus)

# K-Cineplex's 4 Cyprus locations (see scripts/scrape_k_cineplex.py's own
# docstring) sit behind a real Cloudflare bot-verification challenge that
# no in-process parser — on Vercel or otherwise — can get past. A
# stealth-patched Chromium (patchright, via scrapling's StealthyFetcher)
# running here on GitHub's full Linux VM runners does get through, so
# this is that cinema chain's entire scrape path, independent of the
# app's own /api/cron/scrape sweep — same shape as
# scrape-empire-cinemas.yml for Empire Cinemas Sodeco.
#
# Scheduled every 2 hours, matching these 4 cinemas' own
# scrape_interval_minutes: 120 in cinemas/registry.yaml. workflow_dispatch
# stays available too, for a manual re-run any time.
#
# Installs a real Google Chrome (not just patchright's bundled Chromium)
# — the bundled Chromium's Cloudflare-challenge solve, which passed
# cleanly on 2026-09-15, started losing 3-for-3 on every attempt the
# very next day, both scheduled and manual.
# scripts/scrape_k_cineplex.py's real_chrome=True asks Playwright to
# launch this real Chrome install instead.
#
# UPDATE — real_chrome=True alone did NOT fix it: confirmed live,
# 2026-09-23, every scheduled run from 2026-09-16 through today had been
# silently reporting success with 0 real showtimes for all 4 cinemas.
# The actual cause was headless=True itself — a confirmed, still-open
# scrapling bug (github.com/D4Vinci/Scrapling/issues/422) that loops and
# fails to solve Cloudflare's "managed" challenge under headless=True,
# same root cause already found and fixed for Vue/Odeon/Cineworld.
# scripts/scrape_k_cineplex.py now runs headless=False, which is why
# this job installs Xvfb and runs under it below.

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "0 */2 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Scrape and submit
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # See scrape-vue.yml's own comment on this — same block-buffered
          # stdout problem applies here.
          PYTHONUNBUFFERED: "1"
        # xvfb-run gives the browser a real (virtual) display to run
        # non-headless against — see this file's own top comment for why
        # headless=False is required here.
        run: xvfb-run -a python -m scripts.scrape_k_cineplex
