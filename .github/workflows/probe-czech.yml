name: Probe Czech aggregators

# One-off: are Kinobox / Kinomaniak reachable through a Czech Decodo exit? See scripts/probe_czech_aggregators.py
# (moviegoersme/showtimes).

"on":
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install httpx

      - name: Probe
        env:
          DECODO_USERNAME: ${{ secrets.DECODO_USERNAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
        run: python scripts/probe_czech_aggregators.py

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: czech-probe-result
          path: probe-czech-*
          if-no-files-found: warn
