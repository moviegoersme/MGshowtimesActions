name: Probe UCI Paderborn

# Diagnostic only -- does NOT scrape or submit anything. See
# scripts/probe_uci_paderborn.py's own docstring.

"on":
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Probe Paderborn
        env:
          DECODO_USERNAME: ${{ secrets.DECODO_USERNAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
        run: xvfb-run -a python -m scripts.probe_uci_paderborn

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-uci-paderborn-result
          path: probe-uci-paderborn.html
          if-no-files-found: warn
