name: Probe Nordisk Film Biografer (Denmark)

# One-off evidence gathering for Nordisk Film Biografer -- see
# scripts/probe_nfbio.py (in moviegoersme/showtimes) for what it
# looks for and why. www.nfbio.dk refuses connections from outside Denmark; the probe
# pins a Danish Decodo exit and uses scrape-vue.yml's
# setup: real Chrome, headless=False under xvfb, Decodo proxy.

"on":
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Probe nfbio.dk
        env:
          DECODO_USERNAME: ${{ secrets.DECODO_USERNAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a python -m scripts.probe_nfbio

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nfbio-probe-result
          path: probe-nfbio-*
          if-no-files-found: warn
