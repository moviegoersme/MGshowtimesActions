name: Probe Germany UCI Film Page

# Diagnostic only -- does NOT scrape or submit anything. See
# scripts/probe_germany_uci_film.py's own docstring for what this run
# answers: whether a per-film page carries that film's full multi-day
# schedule, since UCI's own cinema page only showed one day's worth.

"on":
  workflow_dispatch: {}

jobs:
  probe-uci-film:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Probe UCI's per-film page
        env:
          DECODO_USERNAME: ${{ secrets.DECODO_USERNAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
        run: xvfb-run -a python -m scripts.probe_germany_uci_film

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-germany-uci-film-result
          path: probe-germany-uci-film.html
          if-no-files-found: warn
