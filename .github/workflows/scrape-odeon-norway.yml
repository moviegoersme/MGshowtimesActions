name: Scrape ODEON Kino (Norway)

# ODEON Norway's 10 real locations (see scripts/scrape_odeon_norway.py's
# own docstring) used to run in-process on Vercel against services.
# cinema-api.com's own fully open, unauthenticated REST API -- confirmed
# working at launch (2026-09-27), then confirmed 100% failing the very
# next day, every run the same flat 403 on the shared movie-catalog
# endpoint. scripts/probe_odeon_norway.py confirmed live: a plain curl
# from a regular dev machine AND GitHub Actions' own raw IP both get a
# clean 200 with no bot-challenge at all -- so this is a Vercel-egress-
# specific IP-reputation block, and moving the whole chain here (no
# proxy needed, unlike Cineplex Germany's identically-shaped block) is
# the entire fix.
#
# Scheduled once per day, matching these 10 cinemas' own
# scrape_interval_minutes: 1440 in cinemas/registry.yaml -- staggered
# from every other scrape-*.yml's own cron in this repo.

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "30 5 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape and submit
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: python -m scripts.scrape_odeon_norway
