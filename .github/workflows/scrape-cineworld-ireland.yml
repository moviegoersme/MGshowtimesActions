name: Scrape Cineworld (Ireland)

# Cineworld Ireland's one real location — Cineworld Dublin, theaterId
# X07A4 (see scripts/scrape_cineworld_ireland.py's own docstring for how
# that was found). cineworld.ie is a separate domain from cineworld.co.uk
# but runs the same Gatsby/boxofficeapi platform, and hard-blocks this
# repo's own runner IP outright (a Cloudflare WAF page, not a solvable
# challenge) — fixed with a Decodo residential proxy pinned to an Irish
# exit, same class of fix scrape-cineworld.yml's own UK build needed
# (see that file's own history for the two-part fix: headless=False +
# Xvfb for the scrapling Cloudflare-solve regression, and a
# country-guaranteed proxy exit for Cloudflare's own Bot Management
# rejecting the generic rotating pool on the API path itself).
#
# One cinema means no batching (nothing to batch) — confirmed live via
# scripts/probe_cineworld_ireland.py's two probe rounds and a real manual
# run of this script (2026-09-30): real showtimes submitted successfully.

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "45 6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Scrape and submit
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DECODO_USERNAME: ${{ secrets.DECODO_USERNAME }}
          DECODO_PASSWORD: ${{ secrets.DECODO_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a python -m scripts.scrape_cineworld_ireland
