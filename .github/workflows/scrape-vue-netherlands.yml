name: Scrape Vue (Netherlands)

# Vue Netherlands's 20 real locations (see scripts/scrape_vue_netherlands.py's
# own docstring) run on the EXACT SAME Sitecore JSS + showings-API
# platform as Vue UK (myvue.com) and CinemaxX Germany, but at a SEPARATE
# domain (vuecinemas.nl) -- myvue.com's own /nl-nl locale 404s, confirmed
# live. A plain out-of-browser fetch works for the first couple of calls
# then 401s (Cloudflare Bot Management scoring, confirmed live) -- no
# in-process parser can sustain a whole cinema's worth of calls. Same
# shape as scrape-vue.yml/scrape-cinemaxx.yml: this is the chain's entire
# scrape path, independent of the app's own /api/cron/scrape sweep.
#
# Solves Cloudflare ONCE per batch of BATCH_SIZE=15 cinemas and reuses
# that one browser session's cookies for every cinema's own API calls in
# it (page.evaluate(fetch(...))), same batching design as scrape_vue.py/
# scrape_cinemaxx.py.
#
# headless=False (not headless=True) is required for the same reason
# scrape-vue.yml's own comment documents: a confirmed, still-open
# scrapling bug (github.com/D4Vinci/Scrapling/issues/422) makes
# headless=True loop and fail to solve Cloudflare's "managed" challenge,
# while headless=False (via Xvfb, installed below) solves it in seconds
# -- confirmed live for Vue Netherlands itself, 2026-09-29 (in fact no
# interactive challenge was even shown on the probe run -- Bot Management
# here appears to score requests rather than gate every visit), no Decodo
# proxy needed on top of it (same as CinemaxX's own no-proxy finding).
#
# Scheduled once per day, matching these 20 cinemas' own
# scrape_interval_minutes: 1440 in cinemas/registry.yaml -- staggered
# 15 minutes apart from this repo's other once-daily GitHub-Actions-only
# scrapes so they don't all fire at once (06:15 UTC is the next free slot
# after scrape-finnkino.yml's 06:00).

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "15 6 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: moviegoersme/showtimes
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m patchright install chrome --with-deps
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Scrape and submit
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: xvfb-run -a python -m scripts.scrape_vue_netherlands
